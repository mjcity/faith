name: Publish study guide
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html
        run: |
          set -euo pipefail
          cat parts/a parts/b > index.html
          test "$(wc -c < index.html)" -eq 14335781
          git config user.name "mjcity"
          git config user.email "shutupandtechmymoney@gmail.com"
          git add index.html
          git rm -f parts/a parts/b
          git commit -m "Publish Faith module 1 vocabulary study guide"
          git push
      - name: Enable GitHub Pages from main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "pages_http=${code}"
          cat /tmp/pages.json
          if [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
            echo "Pages API did not enable the site"
            exit 1
          fi
